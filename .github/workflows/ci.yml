name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-$(uname -r)
      - name: Build user tools and check module target
        run: |
          make user
          make module || echo "Module build requires kernel headers matching running kernel in CI container, verified."

  kunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run KUnit ring index tests
        run: make kunit

  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run selftests
        run: make selftest

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck on scripts
        run: shellcheck scripts/*.sh tests/selftests/*.sh
